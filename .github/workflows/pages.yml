# Builds the Cybron Technologies site with plain Jekyll 4.4 (Gemfile) and
# deploys it to GitHub Pages: the noindex preview at
# cybron.fixmypcperth.com (owner, 18 Oct). Same workflow as Fuzon Apps'
# preview. For this to be the build that ships, Settings > Pages > Source
# must be "GitHub Actions" (don't click "Configure" on the starter it
# offers). The custom domain is set in Settings > Pages; Actions
# deployments ignore a CNAME file, so there isn't one.
#
# Pull requests into main are built and checked but never deployed.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # A Liquid file without its --- front matter fence (robots.txt,
      # sitemap.xml) is copied as-is, so its {{ }} tags would reach the
      # site unrendered. Nothing in the built site should contain one.
      - name: Check built output
        run: |
          if [ ! -f _site/index.html ]; then
            echo "::error::The build produced no _site/index.html, so there is nothing to deploy."
            exit 1
          fi
          if grep -rlE '\{\{|\{%' --include='*.html' --include='*.xml' --include='*.txt' --include='*.css' --include='*.js' --include='*.json' --include='*.webmanifest' _site; then
            echo "::error::The files above contain unrendered Liquid. Add an empty --- front matter fence to the top of each source file."
            exit 1
          fi

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
